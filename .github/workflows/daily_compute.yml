name: daily-compute-and-pages

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-real-tles:
    runs-on: ubuntu-latest
    outputs:
      tle_artifact: latest-tles
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch real TLEs from Space-Track public files
        env:
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PWD: ${{ secrets.SPACETRACK_PWD }}
          SPACETRACK_IDENTITY: ${{ secrets.SPACETRACK_IDENTITY }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import sys
          import json
          from pathlib import Path

          from src.data.tle_fetcher import SpaceTrackClient

          output_path = Path("data/latest_tles.json")
          output_path.parent.mkdir(parents=True, exist_ok=True)

          username = os.getenv("SPACETRACK_USER") or os.getenv("SPACETRACK_IDENTITY")
          password = os.getenv("SPACETRACK_PWD") or os.getenv("SPACETRACK_PASSWORD")

          if not (username and password):
              output_path.write_text(json.dumps({"source": "fallback", "tles": []}, ensure_ascii=False, indent=2), encoding="utf-8")
              print("WARNING: Space-Track credentials not configured, using fallback dataset without real TLEs.")
              sys.exit(0)

          ids = [25544, 40967, 33591, 43013, 44713]
          client = SpaceTrackClient(username=username, password=password)
          try:
              tles = client.get_public_file_tles_by_ids(ids)
          except Exception as exc:
              print(f"WARNING: public files query failed: {exc}", file=sys.stderr)
              try:
                  tles = client.get_latest_tle_by_ids(ids)
              except Exception as inner_exc:
                  print(f"WARNING: basicspacedata fallback query failed: {inner_exc}", file=sys.stderr)
                  tles = []
          output_path.write_text(
              json.dumps({"source": "space-track", "count": len(tles), "tles": tles}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Fetched {len(tles)} TLE records.")
          PY

      - name: Upload TLE artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-tles
          path: data/latest_tles.json
          retention-days: 1

  compute-and-deploy:
    needs: collect-real-tles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download TLE artifact
        uses: actions/download-artifact@v4
        with:
          name: latest-tles
          path: data

      - name: Run daily compute pipeline
        run: |
          python -m src.engine.json_generator

      - name: Generate markdown summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/daily_report.json").read_text(encoding="utf-8"))
          lines = [
              "# AstroQuant 3D Daily Compute Report",
              "",
              f"- Generated at: `{report['generated_at']}`",
              f"- Collision events: **{len(report.get('collision_events', []))}**",
              f"- High risk events (<5km): **{len(report.get('high_risk_events', []))}**",
              f"- Priced assets: **{len(report.get('asset_pricing', []))}**",
              "",
          ]
          Path("data/daily_report.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          force_orphan: true
