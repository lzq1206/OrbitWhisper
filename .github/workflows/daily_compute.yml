name: daily-compute-and-pages

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-real-satellites:
    runs-on: ubuntu-latest
    outputs:
      satellite_artifact: latest-satellites
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests sgp4

      - name: Fetch satellite data from CelesTrak
        run: |
          python fetch_satellites.py --include-large -o data/satellites.json

      - name: Upload satellite data artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-satellites
          path: data/satellites.json
          retention-days: 1

  compute-and-deploy:
    needs: collect-real-satellites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download satellite data artifact
        uses: actions/download-artifact@v4
        with:
          name: latest-satellites
          path: data

      - name: Run daily compute pipeline
        run: |
          python -m src.engine.json_generator

      - name: Generate markdown summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/daily_report.json").read_text(encoding="utf-8"))
          sat_count = report.get("hud_data", {}).get("satellite_count", 0)
          cat_stats = report.get("hud_data", {}).get("category_stats", {})
          lines = [
              "# AstroQuant 3D Daily Compute Report",
              "",
              f"- Generated at: `{report['generated_at']}`",
              f"- Total satellites: **{sat_count}**",
              f"- Collision events: **{len(report.get('collision_events', []))}**",
              f"- High risk events (<5km): **{len(report.get('high_risk_events', []))}**",
              f"- Priced assets: **{len(report.get('asset_pricing', []))}**",
              "",
              "## Satellite Categories",
              "",
          ]
          for cat, count in cat_stats.items():
              lines.append(f"- {cat}: **{count}**")
          lines.append("")
          Path("data/daily_report.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily report with CelesTrak satellite data"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          force_orphan: true
