<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstroQuant 3D - OrbitWhisper</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/cesium@1.120/Build/Cesium/Widgets/widgets.css"
    />
    <style>
      html, body, #cesiumContainer { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      #hud {
        position: absolute; top: 12px; right: 12px; width: min(420px, 36vw); max-height: 90vh; overflow: auto;
        background: rgba(9, 14, 26, 0.82); color: #e5ecff; border: 1px solid rgba(120, 160, 255, 0.4);
        border-radius: 10px; padding: 12px; font-family: Arial, sans-serif; backdrop-filter: blur(4px);
      }
      .warn { color: #ff6b6b; }
      .metric { margin: 4px 0; font-size: 13px; }
      #survivalChart { width: 100%; height: 220px; }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <aside id="hud">
      <h3>AstroQuant 3D HUD</h3>
      <div id="summary"></div>
      <div id="survivalChart"></div>
    </aside>

    <script src="https://cdn.jsdelivr.net/npm/cesium@1.120/Build/Cesium/Cesium.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="./app.js"></script>
  </body>
  </html>
